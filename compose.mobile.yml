name: frss-mobile-test

services:
  mobile:
    platform: linux/amd64
    build:
      context: .
      dockerfile: tests/mobile/Dockerfile
    ports:
      - "127.0.0.1:4723:4723"
    env_file:
      - path: .env.mobile
        required: false
    environment:
      CHROMEDRIVER_CACHE_DIR: /opt/chromedrivers
    volumes:
      - mobile-adb-keys:/root/.android
      - mobile-chromedrivers:/opt/chromedrivers
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4723/status').then(r=>r.json()).then(s=>process.exit(s.value?.ready?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

volumes:
  mobile-adb-keys:
  mobile-chromedrivers:

dding:45px 18px;border:1px dashed var(--border);border-radius:17px;text-align:center;color:var(--muted);background:var(--surface-2);font-size:12px}.history-back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:700}.history-back:hover{color:var(--ink)}.history-back svg{width:15px}.dark .history-badge-expired{background:#35191b;border-color:#5b2929;color:#ff9aa1}.dark .history-badge-reserved{background:#382f16;border-color:#5c4e20;color:#ead58c}@media(max-width:650px){.history-page{padding-top:8px}.history-head{align-items:flex-start;flex-direction:column}.history-head .section-count{align-self:flex-start}.history-card{align-items:flex-start}.history-title-row{align-items:flex-start;flex-direction:column;gap:6px}.history-side{margin-left:auto}.history-toolbar{align-items:stretch;flex-direction:column}.history-toolbar select{width:100%}}

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
        <link rel="icon" type="image/png" href="../img/logo.png">
    <link rel="apple-touch-icon" href="../img/logo.png">
    <title>Register — FRSS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/vendor/feather.min.js"></script>
</head>

<body>
    <main class="auth-page">
        <div class="auth-card"><a class="brand" href="../index.html" aria-label="FRSS home"><span
                    class="brand-mark"><img src="../img/logo.png" alt="" width="20" height="18"></span></a><span
                class="eyebrow">JOIN THE COMMUNITY</span>
            <h1 class="register-title">Create your account</h1>

            <form id="registerForm">
                <label>Full name<input name="fullName" required placeholder="Your name"></label>
                <label>Email<input name="email" type="email" required placeholder="you@example.com"></label>
                <label>
                    <span>Password</span>
                    <div class="password-field"><input id="password" name="password" type="password" required minlength="8"
                            placeholder="At least 8 characters"><button type="button" id="togglePassword" aria-label="Show password" title="Show password">
                            <i data-feather="eye" aria-hidden="true"></i>
                        </button></div>
                </label>
                <label>
                    <span>Confirm password</span>
                    <div class="password-field"><input id="confirmPassword" name="confirmPassword" type="password" required minlength="8"
                            placeholder="Re-enter your password"><button type="button" id="toggleConfirmPassword" aria-label="Show password" title="Show password">
                            <i data-feather="eye" aria-hidden="true"></i>
                        </button></div>
                </label>
                <label class="terms-check">
                    <input name="terms" type="checkbox" required>
                    <span>I accept the <a href="#" aria-label="Terms and Conditions">Terms and Conditions</a>.</span>
                </label>
                <button class="btn btn-primary btn-lg" type="submit">Create account</button>
            </form>
            <p class="auth-foot">Already registered? <a href="login.html">Log in</a></p>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="../js/config.js"></script>
    <button class="theme-fab" id="themeFab" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"><i data-feather="moon" aria-hidden="true"></i></button>
    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>
</body>

</html>

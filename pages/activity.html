<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="apple-touch-icon" href="../img/logo.png">
<title>Donation & claim history — FRSS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<script src="../js/vendor/feather.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/config.js"></script>
<style>
.history-page{max-width:900px;margin:0 auto;padding-bottom:70px}.history-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:20px 0 24px}.history-head h1{margin:5px 0 8px;font-size:clamp(32px,5vw,48px);letter-spacing:-.045em}.history-head p{margin:0;color:var(--muted);font-size:13px}.history-head .section-count{white-space:nowrap}.history-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.history-toolbar select{min-width:180px}.history-list{display:grid;gap:11px}.history-card{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--border);border-radius:17px;background:var(--surface);box-shadow:0 7px 22px rgba(20,20,20,.035)}.history-icon{width:42px;height:42px;flex:0 0 42px;border-radius:13px;display:grid;place-items:center;background:var(--red-soft);color:var(--red)}.history-icon svg{width:18px}.history-main{min-width:0;flex:1}.history-title-row{display:flex;align-items:center;gap:9px;justify-content:space-between}.history-main strong{font-size:13px}.history-main p{margin:4px 0;color:var(--muted);font-size:11px}.history-main small{display:block;color:var(--muted);font-size:9px}.history-badge{display:inline-flex;align-items:center;padding:5px 8px;border:1px solid var(--border);border-radius:999px;background:var(--surface-2);font-size:9px;font-weight:800;text-transform:capitalize;white-space:nowrap}.history-badge-expired{color:#b51e2a;background:#fff0f0;border-color:#f2c2c2}.history-badge-reserved{color:#725c18;background:#fff4d6;border-color:#ead7a0}.history-side{display:flex;align-items:center;gap:8px}.history-code{padding:8px 10px;border:1px dashed var(--red);border-radius:10px;background:var(--red-soft);font-size:13px;font-weight:800;letter-spacing:.12em}.history-muted{color:var(--muted);font-size:10px}.history-details{margin-top:9px;padding:9px 11px;border-radius:10px;background:var(--surface-2);color:var(--muted);font-size:10px;line-height:1.5}.history-empty{padding:45px 18px;border:1px dashed var(--border);border-radius:17px;text-align:center;color:var(--muted);background:var(--surface-2);font-size:12px}.history-back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:700}.history-back:hover{color:var(--ink)}.history-back svg{width:15px}.dark .history-badge-expired{background:#35191b;border-color:#5b2929;color:#ff9aa1}.dark .history-badge-reserved{background:#382f16;border-color:#5c4e20;color:#ead58c}.activity-filter-copy{display:grid;gap:3px}.activity-filter-label{font-size:11px;font-weight:800;color:var(--ink);letter-spacing:.01em}.activity-filter-help{font-size:10px;color:var(--muted)}.activity-filter{position:relative;width:220px}.activity-filter-native{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}.activity-filter-trigger{width:100%;min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border:1px solid var(--border);border-radius:13px;background:var(--surface);color:var(--ink);box-shadow:0 5px 18px rgba(20,20,20,.04);font:inherit;font-size:12px;font-weight:700;cursor:pointer;text-align:left;transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease}.activity-filter-trigger:hover{border-color:rgba(220,38,38,.35);box-shadow:0 8px 24px rgba(20,20,20,.07)}.activity-filter-trigger:focus-visible{outline:3px solid rgba(220,38,38,.16);outline-offset:2px}.activity-filter-trigger svg{width:16px;height:16px;color:var(--muted);transition:transform .18s ease}.activity-filter.open .activity-filter-trigger svg{transform:rotate(180deg)}.activity-filter-menu{position:absolute;z-index:50;top:calc(100% + 7px);right:0;width:100%;padding:6px;border:1px solid var(--border);border-radius:14px;background:var(--surface);box-shadow:0 16px 38px rgba(20,20,20,.14);opacity:0;visibility:hidden;transform:translateY(-5px) scale(.985);transform-origin:top right;transition:opacity .16s ease,transform .16s ease,visibility .16s ease}.activity-filter.open .activity-filter-menu{opacity:1;visibility:visible;transform:translateY(0) scale(1)}.activity-filter-option{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;border-radius:10px;background:transparent;color:var(--ink);padding:10px 11px;font:inherit;font-size:11px;font-weight:600;cursor:pointer;text-align:left}.activity-filter-option:hover{background:var(--surface-2)}.activity-filter-option.active{background:var(--red-soft);color:var(--red);font-weight:800}.activity-filter-option.active::after{content:'✓';font-size:13px}.dark .activity-filter-trigger,.dark .activity-filter-menu{box-shadow:0 16px 38px rgba(0,0,0,.28)}@media(max-width:650px){.history-page{padding-top:8px}.history-head{align-items:flex-start;flex-direction:column}.history-head .section-count{align-self:flex-start}.history-card{align-items:flex-start}.history-title-row{align-items:flex-start;flex-direction:column;gap:6px}.history-side{margin-left:auto}.history-toolbar{align-items:stretch;flex-direction:column}.activity-filter{width:100%}.activity-filter-menu{right:0}}
</style>
</head>
<body data-history-page="activity">
<header class="site-header"><div class="container nav-wrap"><a class="brand" href="../index.html" aria-label="FRSS home"><span class="brand-mark"><img src="../img/logo.png" alt="" width="36" height="36"></span></a><nav class="main-nav"><a href="dashboard.html">Dashboard</a><a href="find-food.html">Find Food</a><a href="donate.html">Donate Food</a><a class="btn btn-outline" href="#" data-logout>Log out</a></nav></div></header>
<main class="section container history-page">
<a class="history-back" href="dashboard.html"><i data-feather="arrow-left"></i> Back to dashboard</a>
<div class="history-head"><div><span class="eyebrow" id="pageEyebrow">MY ACTIVITY</span><h1 id="pageTitle">Donation & claim history</h1><p>Review donations and claims you have participated in.</p></div><span class="section-count" id="pageCount">—</span></div>
<div class="history-toolbar"><div class="activity-filter-copy"><span class="activity-filter-label">Activity filter</span><span class="activity-filter-help">Choose what you want to see.</span></div><div class="activity-filter" id="activityFilterWrap"><select id="activityFilter" class="activity-filter-native" aria-hidden="true" tabindex="-1"><option value="all">All activity</option><option value="donations">My donations</option><option value="claims">My claims</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select><button type="button" class="activity-filter-trigger" id="activityFilterTrigger" aria-haspopup="listbox" aria-expanded="false"><span id="activityFilterValue">All activity</span><i data-feather="chevron-down" aria-hidden="true"></i></button><div class="activity-filter-menu" id="activityFilterMenu" role="listbox" aria-label="Activity filter"><button type="button" class="activity-filter-option active" data-value="all" role="option" aria-selected="true">All activity</button><button type="button" class="activity-filter-option" data-value="donations" role="option" aria-selected="false">My donations</button><button type="button" class="activity-filter-option" data-value="claims" role="option" aria-selected="false">My claims</button><button type="button" class="activity-filter-option" data-value="completed" role="option" aria-selected="false">Completed</button><button type="button" class="activity-filter-option" data-value="cancelled" role="option" aria-selected="false">Cancelled</button></div></div></div>
<div class="history-list" id="historyList"><div class="history-empty">Loading…</div></div>
</main>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/user-history-pages.js"></script>
<script>
(function(){
  const wrap=document.getElementById('activityFilterWrap');
  const trigger=document.getElementById('activityFilterTrigger');
  const menu=document.getElementById('activityFilterMenu');
  const native=document.getElementById('activityFilter');
  const value=document.getElementById('activityFilterValue');
  if(!wrap||!trigger||!menu||!native||!value)return;
  const close=()=>{wrap.classList.remove('open');trigger.setAttribute('aria-expanded','false');};
  trigger.addEventListener('click',()=>{const open=!wrap.classList.contains('open');wrap.classList.toggle('open',open);trigger.setAttribute('aria-expanded',String(open));});
  menu.querySelectorAll('.activity-filter-option').forEach(option=>option.addEventListener('click',()=>{
    const selected=option.dataset.value||'all';
    native.value=selected;
    value.textContent=option.textContent.trim();
    menu.querySelectorAll('.activity-filter-option').forEach(item=>{const active=item===option;item.classList.toggle('active',active);item.setAttribute('aria-selected',String(active));});
    native.dispatchEvent(new Event('change',{bubbles:true}));
    close();
  }));
  document.addEventListener('click',e=>{if(!wrap.contains(e.target))close();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
})();
</script>

</body>
</html>

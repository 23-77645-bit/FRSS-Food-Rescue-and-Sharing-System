<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
        <link rel="icon" type="image/png" href="../img/logo.png">
    <link rel="apple-touch-icon" href="../img/logo.png">
    <title>Set a new password — FRSS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/vendor/feather.min.js"></script>
</head>

<body>
    <main class="auth-page">
        <div class="auth-card"><a class="brand" href="../index.html" aria-label="FRSS home"><span
                    class="brand-mark"><img src="../img/logo.png" alt="" width="20" height="18"></span></a><span
                class="eyebrow">RESET PASSWORD</span>
            <h1>Choose a new password</h1>
            <p class="muted">You arrived here from the reset link in your email.</p>

            <form id="resetPasswordForm">
                <label><span>New password</span>
                    <div class="password-field"><input id="newPassword" name="password" type="password" required
                            minlength="8" placeholder="At least 8 characters"><button type="button" id="toggleNewPassword" aria-label="Show password" title="Show password"><i data-feather="eye" aria-hidden="true"></i></button></div>
                </label>
                <label><span>Confirm new password</span>
                    <div class="password-field"><input id="confirmNewPassword" name="confirmPassword" type="password" required minlength="8"
                        placeholder="Re-enter your new password"><button type="button" id="toggleConfirmNewPassword" aria-label="Show password" title="Show password"><i data-feather="eye" aria-hidden="true"></i></button></div>
                </label>
                <button class="btn btn-primary btn-lg" type="submit">Update password</button>
            </form>

            <p class="auth-foot"><a href="login.html">Back to log in</a></p>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="../js/config.js"></script>
    <button class="theme-fab" id="themeFab" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"><i data-feather="moon" aria-hidden="true"></i></button>
    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>
</body>

</html>

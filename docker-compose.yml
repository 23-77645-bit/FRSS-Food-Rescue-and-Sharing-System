services:
  frss-site:
    image: python:3.12-slim
    container_name: frss-site
    working_dir: /app
    volumes:
      - ./frss:/app
    network_mode: host
    command: python -m http.server 5500
    restart: unless-stopped

  appium:
    image: appium/appium:latest
    container_name: appium
    network_mode: host
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    command: appium --relaxed-security
    restart: unless-stopped
